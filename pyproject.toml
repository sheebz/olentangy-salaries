[project]
name = "school_district_salaries"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.23",
    "duckdb>=1.5.5",
]

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
    "jupyterlab>=4.6.3",
    "kaggle>=1.7.4.5",
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "school_district_salaries"
registry_modules = [
    "school_district_salaries.components.*",
]


